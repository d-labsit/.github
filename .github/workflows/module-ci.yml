# Reusable CI for every d-labsit Magento module. A module's own ci.yml only
# calls this workflow (see templates/ci.yml), so the checks live in one place:
# ci/check.sh, the same script developers and AI agents run locally.
name: module-ci

on:
  workflow_call:

# No permissions block: this workflow gets what the module's ci.yml grants
# (templates/ci.yml). A called workflow can only narrow that, never widen it.

jobs:
  check:
    name: module checks
    # Self-hosted org runner on ci-pr (untrusted box, no secrets): GitHub-hosted
    # minutes are not used. Pull requests from forks never run here -- the org
    # also requires approval for outside contributors, this is the second lock.
    runs-on: [self-hosted, ci-pr]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the shared checks
        uses: actions/checkout@v4
        with:
          repository: d-labsit/.github
          path: .module-ci

      - name: Run ci/check.sh
        env:
          MODULE_CI_DIR: .module-ci
          # Every module passed the convention checks on 2026-10-31: they now fail, not warn.
          DLABSIT_CI_STRICT: '1'
        run: bash .module-ci/ci/check.sh

  merge-guard:
    name: merge guard
    # No branch protection on the free plan: this cannot stop a merge, it makes
    # one without green CI or a D-Labs review visible (failed run + issue).
    runs-on: [self-hosted, ci-pr]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      - name: Fetch the shared checks
        uses: actions/checkout@v4
        with:
          repository: d-labsit/.github
          path: .module-ci

      - name: Check how this commit reached main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: bash .module-ci/ci/merge-guard.sh
