# Checks live in d-labsit/.github (ci/check.sh); this file only calls them.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # merge guard (push to main): read the pull request, its reviews and checks,
  # and open an issue when a commit reached main without them.
  pull-requests: read
  checks: read
  issues: write

jobs:
  module:
    uses: d-labsit/.github/.github/workflows/module-ci.yml@main
